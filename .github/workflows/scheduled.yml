name: Scheduled jobs

# 1) Reads new email and runs the inbound agent on pending leads.
# 2) Runs the agents whose daily schedule has come (prospecting).
# 3) Executes actions that were waiting for their send window or daily limit.
# Backup only: the schedule is driven by a Neon Function (scripts/neon-scheduler)
# every 15 minutes by day. GitHub delays or drops scheduled runs under load, so
# this runs hourly at an odd minute; every call is idempotent.
# Requires repository secrets APP_URL and CRON_SECRET; skipped otherwise.
on:
  schedule:
    - cron: "17 6-19 * * *"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Call the scheduler endpoints
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not configured; skipping."
            exit 0
          fi
          for path in inbound agents release-deferred; do
            curl --fail --silent --show-error --max-time 300 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/$path"
            echo
          done
