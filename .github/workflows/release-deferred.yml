name: Release deferred actions

# Executes actions that were waiting for their send window or daily limit.
# Runs every 30 minutes on weekdays during European working hours only, so the
# serverless database (Neon) can suspend the rest of the time.
# Requires repository secrets APP_URL and CRON_SECRET; skipped otherwise.
on:
  schedule:
    - cron: "*/30 6-19 * * 1-5"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the release endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/release-deferred"
